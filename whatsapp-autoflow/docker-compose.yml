# ──────────────────────────────────────────────────────────────────────
# WhatsApp AutoFlow Claude — PRODUÇÃO (edição Premium)
# git clone + (preencher .env) + docker compose up -d
#
# Entrada pública: Caddy (HTTPS automático em :80/:443) → web (nginx) → api.
# O `web` só escuta em 127.0.0.1:3025 (debug via túnel SSH), não fica exposto.
# Nomes de serviço/container/volume preservados p/ compatibilidade c/ backups.
# ──────────────────────────────────────────────────────────────────────
services:

  caddy:
    image: caddy:2-alpine
    container_name: autoflow2_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}   # defina seu domínio p/ HTTPS automático
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [autoflow2-net]

  mongo:
    image: mongo:6
    container_name: autoflow2_mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks: [autoflow2-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: autoflow2_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [autoflow2-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wa-gateway:
    build: ./backend/wa-gateway
    container_name: autoflow2_gateway
    environment:
      - NODE_ENV=production
      - PORT=3333
      - WEBHOOK_URL=http://api:3000/api/internal/message
      - TZ=America/Sao_Paulo
    volumes:
      - wa_auth:/app/auth   # sessão do WhatsApp — restaurar este volume evita re-escanear QR
    restart: unless-stopped
    networks: [autoflow2-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./backend/api
    container_name: autoflow2_api
    volumes:
      - ./backend/api/src:/app/src
      - /root/autoflow_backups:/backups   # pasta de backups no host (ajuste se mudar)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017/wa_admin
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WA_GATEWAY_URL=http://wa-gateway:3333
      - TZ=America/Sao_Paulo
      - NOTICE_7D=${NOTICE_7D:-Olá {{nome}}! Sua assinatura vence em 7 dias.}
      - NOTICE_1D=${NOTICE_1D:-Atenção {{nome}}! Sua assinatura vence amanhã.}
      - NOTICE_TODAY=${NOTICE_TODAY:-Olá {{nome}}! Sua assinatura expira hoje.}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [autoflow2-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build: ./backend/worker
    container_name: autoflow2_worker
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27017/wa_admin
      - REDIS_HOST=redis
      - WA_GATEWAY_URL=http://wa-gateway:3333
      - MIN_MESSAGE_DELAY_MS=${MIN_MESSAGE_DELAY_MS:-2000}
      - JITTER_MS=${JITTER_MS:-1000}
      - TZ=America/Sao_Paulo
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [autoflow2-net]

  web:
    build: ./web                # SPA Vite + nginx (proxy /api → api:3000)
    container_name: autoflow2_web
    ports:
      - "127.0.0.1:3025:80"     # só local (debug); o público entra pelo Caddy
    depends_on: [api]
    restart: unless-stopped
    networks: [autoflow2-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  autoflow2-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  wa_auth:
  caddy_data:
  caddy_config:
