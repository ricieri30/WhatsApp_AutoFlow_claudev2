# Frontend nginx — serve o SPA e faz proxy de /api para a API interna.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → container 'api' na mesma rede docker (porta 3000).
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Páginas estáticas auxiliares (já existem, fora do bundle React).
  location = /backup.html { try_files /backup.html =404; }
  location = /conta.html  { try_files /conta.html  =404; }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
